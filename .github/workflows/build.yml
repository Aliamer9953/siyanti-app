name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Java JDK
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Create and Setup App
      run: |
        flutter create siyanti_app
        cd siyanti_app
        flutter pub add firebase_core firebase_auth cloud_firestore cupertino_icons
        cp ../*.dart lib/ 2>/dev/null || true
        flutter build apk --debug --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: siyanti-app-debug
        path: siyanti_app/build/app/outputs/flutter-apk/app-debug.apk
