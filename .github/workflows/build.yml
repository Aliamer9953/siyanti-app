name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Java JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Setup Flutter App Structure
      run: |
        mkdir -p temp_lib
        mv *.dart temp_lib/ 2>/dev/null || true
        flutter create . --org com.siyanti.app --project-name siyanti --force
        rm -rf lib/*
        cp -r temp_lib/* lib/
        cp temp_lib/main.dart lib/main.dart

    - name: Update pubspec dependencies
      run: |
        flutter pub add firebase_core firebase_auth cloud_firestore cupertino_icons

    - name: Build APK
      run: flutter build apk --debug --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: siyanti-app-debug
        path: build/app/outputs/flutter-apk/app-debug.apk
